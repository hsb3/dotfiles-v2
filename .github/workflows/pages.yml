name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # The package index is generated from `packages`, so there is no list to keep in sync.
      - name: Site config and package index
        run: |
          cp .github/pages/_config.yml _config.yml
          printf '\n## Packages\n\n' >>README.md
          grep -Ev '^[[:space:]]*(#|$)' packages | while IFS= read -r p; do
            printf -- '- [%s](%s/README.md)\n' "$p" "$p"
          done >>README.md
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
      - uses: actions/upload-pages-artifact@v3
      - id: deploy
        uses: actions/deploy-pages@v4
