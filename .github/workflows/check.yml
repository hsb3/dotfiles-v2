name: check
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew bundle --file=_gate/Brewfile
      - run: make check
  # A real install, twice, then verify. The runner is not a fresh machine: its image
  # already has Homebrew and many formulas, and its own dotfiles are moved aside first,
  # so this does not replace _gate/fresh-account.md (R14). Too slow (casks) for every
  # PR, and not a merge requirement.
  install:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Move aside runner files that v2 links
        run: |
          find ./*/home -type f ! -name .DS_Store | while IFS= read -r f; do
            t="$HOME/${f#./*/home/}"
            if [ -e "$t" ] && [ ! -L "$t" ]; then mv "$t" "$t.pre-v2" && echo "moved aside: $t"; fi
          done
      - run: ./bootstrap.sh
      - name: First install
        run: ./install.sh
      - name: Second install changes nothing in v2's paths
        run: |
          m="$(mktemp)"
          sleep 1
          ./install.sh
          prefix="$(brew --prefix)"
          paths=("$HOME/.gitconfig" "$HOME/.config/gh/config.yml" "$HOME/.config/mise/config.toml"
            "$HOME/.config/fnox/config.toml" "$HOME/.local/share/zsh/site-functions")
          while IFS= read -r f; do paths+=("$HOME/${f#./*/home/}"); done < <(find ./*/home -type f ! -name .DS_Store)
          changed="$(find "${paths[@]}" -newer "$m" 2>/dev/null
            find "$HOME/.local/share/mise/installs" "$prefix/Cellar" "$prefix/Caskroom" -mindepth 1 -maxdepth 2 -newer "$m" 2>/dev/null)"
          if [ -n "$changed" ]; then
            echo "changed by the second install:"
            echo "$changed"
            exit 1
          fi
          echo "second install changed nothing in ${#paths[@]} v2 paths, mise installs, Cellar or Caskroom"
      - run: ./verify.sh
      # verify.sh proves files are linked, not that they load: a compinit abort or plugin
      # error only shows when an interactive shell starts. script(1) gives zsh a TTY.
      - name: Interactive zsh starts without output
        run: |
          out="$(script -q /dev/null zsh -i -c exit </dev/null 2>&1 | tr -d '\b\r' | sed 's/\^D//g')"
          if [ -n "$out" ]; then echo "$out"; exit 1; fi
